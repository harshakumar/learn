ads, strict Azure Policy initiatives aligned to internal control frameworks (often mapped to ISO 27001 and, where relevant, PCI DSS for payment data), mandatory encryption and data residency controls, centralised logging with defined retention for audit purposes, and a clear operational resilience story (backup, disaster recovery, incident response) that would satisfy typical UK financial regulator expectations around outsourcing and operational risk.","keyPoints":["Segregate regulated workloads via management group/policy boundaries","Map technical controls to internal/external frameworks (ISO 27001, relevant regulatory guidance)","Centralised logging with defined retention for audit and investigation","Documented resilience and incident response aligned to regulatory expectations","Governance should be demonstrable/auditable, not just technically present"],"example":"A core payments platform might sit in its own management group with the strictest policy initiative, mandatory Private Endpoints, and extended log retention, distinct from the marketing website's much lighter governance tier.","mistakes":"Describing only technical controls without acknowledging the need for auditability and alignment with regulatory/compliance expectations.","followUp":"","seniorAdd":"A senior candidate should acknowledge they're not a compliance officer, but should show they know how to work with legal/compliance teams and translate regulatory requirements into concrete Azure controls.","num":51},{"id":"DV1","category":"devsecops","categoryLabel":"Azure DevSecOps & CI/CD Security","difficulty":"Intermediate","scenario":false,"question":"How do you scan Infrastructure as Code (Terraform/Bicep) for security issues before deployment?","testing":"Shift-left security awareness for IaC-heavy roles.","answer":"Add a static analysis/policy-as-code scanning step (e.g. Checkov, tfsec, or Defender for Cloud's IaC scanning integration) to the CI pipeline that runs before apply/deployment, failing the build on high-severity findings such as public storage accounts, missing encryption, or overly permissive NSG rules, so misconfigurations are caught before they ever reach Azure.","keyPoints":["Static scanning of Terraform/Bicep before deployment","Fail the pipeline on high-severity findings","Complements, doesn't replace, runtime posture checks (Defender for Cloud)","Encourages fixing issues at the source (code) rather than after deployment"],"example":"A pull request adding a storage account with public access enabled is automatically flagged and blocked by the IaC scanning step before it can be merged and deployed.","mistakes":"Relying only on post-deployment Defender for Cloud recommendations without any pre-deployment scanning, meaning issues are found only after they're already live.","followUp":"","seniorAdd":"","num":52},{"id":"DV2","category":"devsecops","categoryLabel":"Azure DevSecOps & CI/CD Security","difficulty":"Intermediate","scenario":false,"question":"How do you secure Azure DevOps service connections?","testing":"Practical pipeline security knowledge.","answer":"Prefer Workload Identity Federation (OIDC-based, no stored secret) over classic service principal secrets, scope each service connection's permissions to only the subscription/resource group it needs, restrict which pipelines/branches can use a given connection, and audit connection usage periodically.","keyPoints":["Workload Identity Federation over stored client secrets","Least-privilege scope per connection","Restrict connection usage to specific pipelines/branches where possible","Periodic audit of unused or over-permissioned connections"],"example":"A production deployment service connection is scoped only to the production resource group, restricted to the main branch's release pipeline, and uses Workload Identity Federation instead of a client secret.","mistakes":"Using one broadly-scoped service connection across all pipelines and environments for convenience.","followUp":"","seniorAdd":"","num":53},{"id":"DV3","category":"devsecops","categoryLabel":"Azure DevSecOps & CI/CD Security","difficulty":"Intermediate","scenario":false,"question":"What's the difference between shift-left security and traditional post-deployment scanning?","testing":"Conceptual understanding of DevSecOps philosophy.","answer":"Shift-left means catching security issues as early as possible in the development lifecycle — code review, IaC scanning, dependency scanning in CI — rather than relying solely on scanning or Defender for Cloud recommendations after resources are already deployed and potentially exposed.","keyPoints":["Shift-left = earlier detection, cheaper and faster to fix","Post-deployment scanning still valuable as a safety net, not a replacement","Requires developer buy-in and fast feedback loops to succeed","Combines code, dependency, IaC, and container image scanning"],"example":"A vulnerable dependency is caught by a pipeline scan before merge, rather than being discovered weeks later by a Defender for Cloud vulnerability assessment on the running container.","mistakes":"Treating shift-left as a replacement for runtime/posture monitoring rather than a complementary earlier layer.","followUp":"","seniorAdd":"","num":54},{"id":"DV4","category":"devsecops","categoryLabel":"Azure DevSecOps & CI/CD Security","difficulty":"Advanced","scenario":false,"question":"How would you implement secretless CI/CD authentication to Azure?","testing":"Advanced, current best-practice knowledge that distinguishes strong DevSecOps candidates.","answer":"Use Workload Identity Federation, which lets a CI/CD platform (Azure DevOps, GitHub Actions) exchange a short-lived OIDC token for an Azure AD access token, trusting the pipeline's identity directly rather than storing a client secret or certificate at all.","keyPoints":["OIDC federation between CI/CD platform and Entra ID","No stored client secret or certificate to leak or rotate","Trust established via federated credential configuration on the app registration","Available for both Azure DevOps and GitHub Actions"],"example":"A GitHub Actions workflow authenticates to Azure using OIDC federation, receiving a short-lived token scoped to the specific workflow and repository rather than a long-lived stored secret.","mistakes":"Continuing to use client-secret-based service principals 'because that's how it's always been done' when federation is available and removes a whole class of leak risk.","followUp":"","seniorAdd":"","num":55},{"id":"DV5","category":"devsecops","categoryLabel":"Azure DevSecOps & CI/CD Security","difficulty":"Intermediate","scenario":false,"question":"What security gates would you add to a production release pipeline?","testing":"Practical pipeline design for a regulated or security-conscious environment.","answer":"Require code review approval, pass IaC/dependency/container scanning with no unresolved high-severity findings, require manual approval from an authorised approver for production stage, verify the deployment uses Workload Identity Federation/Managed Identity rather than static credentials, and ensure post-deployment smoke tests and monitoring are in place before marking the release complete.","keyPoints":["Mandatory scanning gates with defined severity thresholds","Manual approval gate before production deployment","Verify secretless authentication is in use","Post-deployment validation, not just 'deploy and done'"],"example":"A pipeline blocks promotion to production until a security scan shows zero high/critical findings and a named approver has signed off in Azure DevOps.","mistakes":"Adding gates that are technically present but routinely bypassed or overridden without proper justification, which undermines their purpose.","followUp":"","seniorAdd":"","num":56},{"id":"ST1","category":"storage","categoryLabel":"Azure Storage, Compute & Database Security","difficulty":"Intermediate","scenario":false,"question":"How do you secure an Azure SQL Database against unauthorized access?","testing":"Database-specific security controls.","answer":"Use Entra ID authentication instead of SQL logins where possible, connect via Private Endpoint rather than the public endpoint, enable Transparent Data Encryption (on by default), apply firewall rules as a fallback layer, enable auditing and Defender for SQL for threat detection, and grant database-level permissions following least privilege.","keyPoints":["Prefer Entra ID authentication over SQL logins","Private Endpoint over public endpoint with firewall rules","Defender for SQL for vulnerability assessment and threat detection","Least-privilege database roles, not blanket db_owner access"],"example":"An application connects to Azure SQL via a Private Endpoint using a Managed Identity mapped to an Entra ID-authenticated database user with only the permissions its queries require.","mistakes":"Leaving the public endpoint enabled 'just in case' after setting up a Private Endpoint, which keeps an unnecessary attack surface open.","followUp":"","seniorAdd":"","num":57},{"id":"ST2","category":"storage","categoryLabel":"Azure Storage, Compute & Database Security","difficulty":"Intermediate","scenario":false,"question":"What's the difference between Azure SQL firewall rules and Private Endpoints for database access?","testing":"A frequently confused pair of controls.","answer":"Firewall rules allow specific IP ranges to reach the database's public endpoint — the database is still technically internet-facing, just restricted. A Private Endpoint gives the database a private IP inside a VNet, and once public network access is disabled, the database isn't reachable from the internet at all, only from within (or connected to) that VNet.","keyPoints":["Firewall rules: public endpoint remains, access restricted by IP","Private Endpoint: private IP, public access can be fully disabled","Private Endpoint is the stronger control for sensitive data","Firewall rules can be a reasonable interim step or fallback"],"example":"A database holding customer PII would typically use a Private Endpoint with public access disabled entirely, rather than relying on firewall rules alone.","mistakes":"Treating restrictive firewall rules as equivalent in strength to disabling public access via a Private Endpoint.","followUp":"","seniorAdd":"","num":58},{"id":"ST3","category":"storage","categoryLabel":"Azure Storage, Compute & Database Security","difficulty":"Advanced","scenario":false,"question":"How would you secure Azure Kubernetes Service (AKS) in an enterprise environment?","testing":"Container/orchestration security depth, increasingly common in senior Azure roles.","answer":"Use Entra ID integration with Azure RBAC for cluster access instead of local Kubernetes accounts, enable Azure Policy for Kubernetes to enforce pod security standards, use Private Clusters/Private Endpoints so the API server isn't publicly exposed, apply network policies to restrict pod-to-pod traffic, use Managed Identity for pods needing Azure resource access (via workload identity), and scan container images for vulnerabilities before deployment via Defender for Containers.","keyPoints":["Entra ID + Azure RBAC for cluster access control","Private cluster to avoid exposing the API server publicly","Kubernetes network policies for pod-level segmentation","Workload identity instead of stored credentials in pods","Image scanning via Defender for Containers before and during runtime"],"example":"A namespace running a payment-processing workload might have strict network policies isolating it from other namespaces, with its pods using workload identity to access Key Vault rather than mounted secrets.","mistakes":"Leaving the AKS API server publicly accessible with only firewall/IP restrictions rather than using a private cluster where the security requirements justify it.","followUp":"","seniorAdd":"A senior candidate should also discuss supply-chain security for container images (signed images, trusted registries) and pod security admission controls.","num":59},{"id":"ST4","category":"storage","categoryLabel":"Azure Storage, Compute & Database Security","difficulty":"Intermediate","scenario":false,"question":"What backup and recovery considerations matter for security, particularly ransomware resilience?","testing":"Connects backup/DR (often seen as purely operational) to security thinking.","answer":"Use Azure Backup with soft-delete and immutable backup vaults so backups can't be deleted or encrypted even by a compromised administrator account, ensure backups are logically or physically separated from production access (different credentials/permissions), test restores regularly, and align retention with both operational and compliance needs.","keyPoints":["Immutable/soft-delete backup vaults resist ransomware and insider threats","Separate access permissions for backup management from production admin","Regular restore testing, not just backup completion checks","Retention aligned to both recovery objectives and compliance requirements"],"example":"An organisation configures its Backup vault with immutability enabled so that even an attacker with Global Administrator-level compromise cannot delete existing recovery points within the immutability window.","mistakes":"Assuming backups exist purely for hardware failure scenarios and not considering that a compromised privileged account could delete or encrypt backups too.","followUp":"","seniorAdd":"","num":60},{"id":"ST5","category":"storage","categoryLabel":"Azure Storage, Compute & Database Security","difficulty":"Intermediate","scenario":false,"question":"How do you secure Cosmos DB, and what's different about its security model compared to Azure SQL?","testing":"Awareness that not all Azure data stores share identical security controls.","answer":"Cosmos DB supports Entra ID-based RBAC (data plane RBAC) alongside the traditional primary/secondary key model, Private Endpoints for network isolation, encryption at rest by default, and firewall/VNet rules for restricting access. Unlike Azure SQL, Cosmos DB historically relied more heavily on account keys, so migrating to Entra ID-based data plane RBAC and avoiding key-based access where possible is a key modern security improvement.","keyPoints":["Cosmos DB supports Entra ID data-plane RBAC, not just account keys","Private Endpoints and firewall rules for network isolation","Encryption at rest by default, customer-managed keys optional","Historically more key-reliant than Azure SQL, so migrating off keys matters"],"example":"An application originally using a Cosmos DB primary key is migrated to use Entra ID authentication with a Managed Identity and scoped RBAC role instead, removing a long-lived, high-privilege key from its configuration.","mistakes":"Continuing to use account keys long-term when Entra ID-based RBAC access is available and more auditable.","followUp":"","seniorAdd":"","num":61},{"id":"SC1","category":"scenario","categoryLabel":"Scenario-Based / Troubleshooting","difficulty":"Intermediate","scenario":true,"question":"A developer accidentally commits an Azure Storage account key to a public GitHub repository. What do you do?","testing":"Incident response reflexes for a very common real-world mistake.","answer":"Assess: confirm the key was public and for how long, and what the account contains. Contain: immediately rotate the storage account key (or regenerate it) to invalidate the exposed one. Investigate: check storage account logs for any access from unfamiliar IPs during the exposure window. Remediate: remove the key from the repository history (not just the latest commit), and rotate any dependent application configuration. Prevent recurrence: move to Managed Identity/RBAC instead of account keys, and add secret-scanning to the CI pipeline/repository.","keyPoints":["Rotate the key immediately — treat it as compromised","Check access logs for the exposure window","Scrub the key from full git history, not just the latest commit","Move toward Managed Identity to eliminate account keys long-term","Add automated secret scanning to prevent recurrence"],"example":"GitHub's own secret scanning or a similar tool in the pipeline could have caught this before merge; adding that control is a direct, concrete outcome of the incident review.","mistakes":"Only deleting the file from the latest commit without purging it from git history, where it remains fully recoverable.","followUp":"","seniorAdd":"A senior candidate should also discuss the process change (secret scanning, developer training, moving to Managed Identity) needed to prevent recurrence, not just the immediate fix.","num":62},{"id":"SC2","category":"scenario","categoryLabel":"Scenario-Based / Troubleshooting","difficulty":"Advanced","scenario":true,"question":"You detect a suspicious sign-in from an unfamiliar country for a privileged account. Walk through your response.","testing":"Identity-focused incident response process.","answer":"Assess: check Entra ID sign-in logs and Identity Protection risk detections for the event's details (location, device, risk level). Contain: if genuinely suspicious, disable the account or revoke active sessions/tokens immediately, and require a password reset with MFA re-registration. Investigate: review what the account accessed or attempted during the session, and check for any new admin actions (new users, role assignments, forwarding rules) made during that window. Remediate: reverse any unauthorised changes found. Prevent recurrence: tighten Conditional Access policies (e.g. block legacy auth, require compliant devices for privileged roles) and move the account to PIM-based just-in-time access if it wasn't already.","keyPoints":["Assess via sign-in logs and Identity Protection risk scoring","Contain by disabling account/revoking sessions if confirmed suspicious","Investigate for any unauthorised changes made during the session","Remediate by reversing malicious changes","Prevent recurrence with tighter Conditional Access and PIM"],"example":"If the investigation finds a new mail-forwarding rule or a new Global Administrator was created during the suspicious session, those specific artefacts need explicit reversal, not just account containment.","mistakes":"Stopping at 'disable the account' without checking what actions the attacker may have taken during their access window.","followUp":"","seniorAdd":"","num":63},{"id":"SC3","category":"scenario","categoryLabel":"Scenario-Based / Troubleshooting","difficulty":"Intermediate","scenario":true,"question":"A production VM is found exposed to the internet on port 3389 (RDP). How do you respond?","testing":"Common, practical misconfiguration remediation.","answer":"Assess: check NSG rules and any public IP configuration to confirm the exposure, and check sign-in/security logs for evidence of exploitation attempts or success. Contain: immediately restrict or remove the NSG rule allowing inbound 3389 from any source. Investigate: review the VM for signs of compromise if there's evidence of successful access. Remediate: move access to Azure Bastion or JIT VM access instead of a direct public port. Prevent recurrence: apply an Azure Policy denying public RDP/SSH exposure across the estate.","keyPoints":["Confirm exposure via NSG review","Immediately restrict the offending rule","Check for evidence of exploitation before assuming it's benign","Move to Bastion/JIT rather than reopening the port narrowly","Policy-enforce this pattern estate-wide to prevent recurrence"],"example":"Azure Policy has a built-in definition to flag or deny management ports open to 'Any' source, which would have caught this before or shortly after it happened.","mistakes":"Simply narrowing the source IP range on the existing rule without considering removing direct exposure entirely via Bastion/JIT.","followUp":"","seniorAdd":"","num":64},{"id":"SC4","category":"scenario","categoryLabel":"Scenario-Based / Troubleshooting","difficulty":"Advanced","scenario":true,"question":"An Azure Storage account was accidentally made public and may have exposed customer data. What's your process?","testing":"Data-breach-adjacent incident handling, including non-technical considerations.","answer":"Assess: determine what data was in the container, how long it was public, and whether access logs show any external access. Contain: immediately disable public access. Investigate: review storage analytics/logs for requests during the exposure window and cross-reference source IPs against known scanners vs. potentially malicious actors. Remediate: rotate any credentials or tokens present in the exposed data if applicable. Prevent recurrence: apply policy to deny public access account-wide, and escalate to the relevant data protection/legal function if personal data may have been exposed, given potential UK GDPR notification obligations.","keyPoints":["Immediately disable public access to contain further exposure","Review access logs during the exposure window","Escalate to data protection/legal if personal data may be involved","UK GDPR may require breach assessment and, in some cases, notification","Policy-enforce 'no public storage' to prevent recurrence"],"example":"If logs show only automated internet scanner traffic touched the container, that materially changes the risk assessment compared with evidence of a targeted download of the full dataset.","mistakes":"Treating this as a purely technical fix without involving data protection/legal colleagues when personal data may have been exposed.","followUp":"","seniorAdd":"A senior candidate should know that UK GDPR has specific timeframes for assessing and, where required, reporting personal data breaches, even though the technical remediation is straightforward.","num":65},{"id":"SC5","category":"scenario","categoryLabel":"Scenario-Based / Troubleshooting","difficulty":"Advanced","scenario":true,"question":"Your organisation suspects a ransomware attack has begun encrypting files on Azure VMs. What do you do?","testing":"High-pressure incident response reasoning.","answer":"Assess: confirm scope via Defender for Cloud/Defender for Endpoint alerts and identify affected VMs. Contain: isolate affected VMs at the network level (NSG deny-all or disconnect NICs) to stop lateral spread, and disable any compromised accounts involved. Investigate: identify the entry point (often a compromised identity or exposed RDP) using Sentinel/Defender XDR correlation. Remediate: restore affected systems from immutable backups rather than paying a ransom or trusting a potentially backdoored system, and rebuild compromised VMs rather than just cleaning them. Prevent recurrence: close the entry vector found, and review backup immutability and identity hygiene estate-wide.","keyPoints":["Isolate affected systems immediately to stop lateral movement","Identify and contain the entry point (often identity-based)","Restore from immutable backups rather than trusting cleaned systems","Rebuild rather than just disinfect compromised hosts","Address the root cause (e.g. exposed RDP, compromised credentials) estate-wide"],"example":"If the entry point was a compromised privileged account with standing access, the recovery plan should include forcing credential resets and reviewing whether PIM would have limited the blast radius.","mistakes":"Restoring systems without first identifying and closing the entry point, which risks immediate re-infection.","followUp":"","seniorAdd":"A senior candidate should also mention coordinating with incident response retainers/NCSC guidance where relevant, and the decision framework around backup immutability that made recovery possible without paying a ransom.","num":66},{"id":"SC6","category":"scenario","categoryLabel":"Scenario-Based / Troubleshooting","difficulty":"Advanced","scenario":true,"question":"An attacker has obtained credentials for a privileged Entra ID account. How do you investigate and contain?","testing":"Privilege-escalation-specific incident handling.","answer":"Assess: use Identity Protection and sign-in logs to confirm the compromise and scope of access the role provides. Contain: revoke all active sessions/tokens for the account, force a password reset, and if PIM was in use, deactivate any active role assignments immediately. Investigate: audit logs for any changes made using the privileged role during the compromise window (new users, role grants, app registrations, changed Conditional Access policies). Remediate: reverse unauthorised changes, particularly any new privileged accounts or backdoor app registrations the attacker may have created for persistence. Prevent recurrence: move the account to PIM if it wasn't already, enforce phishing-resistant MFA for privileged roles, and review Conditional Access coverage for privileged accounts.","keyPoints":["Revoke sessions and force credential reset immediately","Check for persistence mechanisms the attacker may have created (new admin accounts, app registrations)","Reverse any unauthorised privileged changes","Move to PIM and phishing-resistant MFA to prevent recurrence","Assume the attacker tried to establish persistence, not just steal data"],"example":"A common persistence technique is creating a new app registration with broad permissions and a client secret, which would survive a simple password reset on the original compromised account.","mistakes":"Resetting the compromised account's password and considering the incident closed without checking for persistence mechanisms created during the compromise.","followUp":"","seniorAdd":"","num":67},{"id":"SC7","category":"scenario","categoryLabel":"Scenario-Based / Troubleshooting","difficulty":"Intermediate","scenario":true,"question":"A team wants an application to connect to Azure SQL without a public endpoint. How would you design this?","testing":"Practical design question combining several earlier concepts.","answer":"Deploy a Private Endpoint for the Azure SQL server into the application's VNet, link the corresponding Private DNS zone to that VNet (and any other VNets needing resolution), disable the database's public network access entirely, and configure the application to authenticate via Managed Identity with a scoped database role rather than SQL login credentials.","keyPoints":["Private Endpoint into the application's VNet","Private DNS zone linked and correctly resolving","Public network access disabled on the SQL server","Managed Identity for authentication instead of stored credentials"],"example":"After this setup, even if the application's connection string were somehow exposed, the database still couldn't be reached from outside the VNet, and there's no static credential to steal in the first place.","mistakes":"Setting up the Private Endpoint but forgetting to disable public access, leaving the original exposure path still available.","followUp":"","seniorAdd":"","num":68},{"id":"SC8","category":"scenario","categoryLabel":"Scenario-Based / Troubleshooting","difficulty":"Advanced","scenario":true,"question":"Your company is migrating from on-premises to Azure and needs a secure landing environment before workloads move. What would you set up first?","testing":"Sequencing and prioritisation for a greenfield secure foundation.","answer":"Before migrating any workload, establish the foundational Landing Zone elements: management group and subscription structure, baseline Azure Policy initiatives, core networking (hub VNet, connectivity to on-premises, Azure Firewall), Entra ID and RBAC foundations (including PIM for privileged roles), and centralised logging/Sentinel connectivity — so every migrated workload lands into a governed, monitored environment from day one rather than governance being retrofitted afterward.","keyPoints":["Management group/subscription structure and baseline policy first","Core connectivity and network security (hub, firewall) before workloads arrive","Identity foundations (RBAC, PIM, Conditional Access) established early","Centralised logging/Sentinel in place before workloads generate data to monitor","Avoids costly retrofitting of governance after workloads are already live"],"example":"Migrating the first workload directly into an ungoverned subscription, then trying to retrofit policy and monitoring afterward, typically costs significantly more effort than establishing the foundation first.","mistakes":"Prioritising speed of the first workload migration over establishing the governance foundation, which usually creates significant rework later.","followUp":"","seniorAdd":"A senior candidate should acknowledge the business pressure to move fast and describe how to establish a 'good enough' secure foundation quickly rather than either blocking migration entirely or skipping it.","num":69},{"id":"SR1","category":"senior","categoryLabel":"Senior/Lead-Level Azure Security Questions","difficulty":"Senior","scenario":false,"question":"Design a secure multi-subscription Azure landing zone for an enterprise.","testing":"End-to-end architectural thinking combining governance, identity, network, and monitoring.","answer":"Structure management groups to separate platform (connectivity, identity, management) from workload subscriptions, and workload subscriptions further by environment (prod/non-prod) and sensitivity. Apply baseline Azure Policy initiatives at the management group level for security, tagging, and allowed regions. Use a hub-and-spoke (or Virtual WAN for larger scale) network topology with centralised Azure Firewall and DNS. Establish identity foundations with RBAC, PIM for privileged roles, and Conditional Access baked in from day one. Centralise logging into Sentinel-connected Log Analytics workspaces. Design this as a repeatable, policy-enforced pattern that new workload subscriptions inherit automatically, rather than a one-off configuration.","keyPoints":["Management group hierarchy separating platform and workload concerns","Policy-as-code baseline applied at scale, not per-subscription","Centralised network and identity foundations","Centralised, policy-enforced logging from day one","Designed to be repeatable/self-service for new subscriptions, not bespoke each time"],"example":"A new subscription request automatically inherits network peering to the hub, baseline security policies, and diagnostic settings forwarding to the central workspace, with no manual security configuration required from the requesting team.","mistakes":"Designing a landing zone that looks correct on a whiteboard but requires manual, non-scalable configuration for every new subscription.","followUp":"","seniorAdd":"A strong answer should acknowledge trade-offs — e.g. between strict central control and workload team autonomy/velocity — rather than presenting one rigid structure as universally correct.","num":70},{"id":"SR2","category":"senior","categoryLabel":"Senior/Lead-Level Azure Security Questions","difficulty":"Senior","scenario":false,"question":"How would you implement Zero Trust across an entire Azure estate, not just the network layer?","testing":"Whether the candidate can go beyond network segmentation to a holistic Zero Trust programme.","answer":"Zero Trust spans identity (Conditional Access, PIM, phishing-resistant MFA), devices (compliance requirements before granting access), network (Private Endpoints, micro-segmentation, no implicit VNet trust), application (token validation on every call, not just at the perimeter), and data (classification and DLP via Microsoft Purview) — implemented incrementally with clear success metrics for each pillar, rather than as a single project.","keyPoints":["Identity: Conditional Access, PIM, strong MFA","Device: compliance-based access requirements","Network: no implicit trust, Private Endpoints, segmentation","Application: continuous token validation, not perimeter-only trust","Data: classification and protection via Purview"],"example":"A Zero Trust rollout might start with Conditional Access requiring compliant devices for privileged access, then progressively extend to requiring it for all corporate application access as device management maturity improves.","mistakes":"Presenting Zero Trust as a single network re-architecture project rather than a cross-cutting, multi-year programme spanning identity, device, network, application, and data.","followUp":"","seniorAdd":"A senior candidate should discuss sequencing and change management — Zero Trust rolled out too aggressively can break legitimate business processes if not phased carefully.","num":71},{"id":"SR3","category":"senior","categoryLabel":"Senior/Lead-Level Azure Security Questions","difficulty":"Senior","scenario":false,"question":"How would you balance security, availability, performance, and cost when making architecture decisions?","testing":"Real-world trade-off reasoning rather than 'security above all else' idealism.","answer":"Treat these as competing constraints to be explicitly reasoned about per decision rather than defaulting to one dimension: quantify the risk being mitigated against the cost/performance/availability impact, favour controls with low friction and high impact first (e.g. Managed Identity has essentially no downside), and be transparent with stakeholders when a security control genuinely trades off against another priority so the decision is made consciously rather than by default.","keyPoints":["Not every control is 'free' — some genuinely trade off against performance/cost/availability","Prioritise high-impact, low-friction controls first","Make trade-offs explicit and risk-based rather than dogmatic","Involve business stakeholders in decisions with real trade-offs"],"example":"Requiring Private Endpoints everywhere is usually low-friction and high-value, but adding an extra layer of synchronous security scanning to a latency-sensitive real-time system might genuinely need a considered trade-off discussion.","mistakes":"Giving a purely idealistic 'security always wins' answer without acknowledging that real organisations have to balance competing, legitimate priorities.","followUp":"","seniorAdd":"","num":72},{"id":"SR4","category":"senior","categoryLabel":"Senior/Lead-Level Azure Security Questions","difficulty":"Senior","scenario":false,"question":"How would you design centralized security monitoring and incident response for an organisation with 50+ subscriptions?","testing":"Programme-level thinking, not just a single tool configuration.","answer":"Centralise log ingestion into a small number of Sentinel-connected workspaces via policy-enforced diagnostic settings, build a tiered set of analytics rules mapped to the organisation's actual threat model rather than enabling every built-in rule indiscriminately, define clear incident response runbooks and escalation paths per incident category, and establish regular tuning cycles to manage alert fatigue as the estate grows.","keyPoints":["Policy-enforced centralised logging so no subscription is a blind spot","Analytics rules prioritised by actual threat model, not just enabled by default","Documented runbooks and escalation paths per incident type","Ongoing tuning process to manage alert volume and false positives as the estate scales","Clear ownership between central security team and workload teams for response actions"],"example":"Rather than enabling all 200+ built-in Sentinel analytics rule templates, a mature programme selects and tunes the subset relevant to its actual risk profile, avoiding SOC alert fatigue.","mistakes":"Assuming that simply enabling Sentinel and every built-in rule constitutes a monitoring programme, without runbooks, tuning, or clear ownership.","followUp":"","seniorAdd":"","num":73},{"id":"SR5","category":"senior","categoryLabel":"Senior/Lead-Level Azure Security Questions","difficulty":"Senior","scenario":false,"question":"If you inherited an Azure environment with years of security debt, how would you prioritise and sequence the remediation programme?","testing":"Programme leadership and pragmatic prioritisation under real constraints — a strong differentiator question.","answer":"Start with a baseline assessment (Defender for Cloud Secure Score, RBAC/PIM review, network exposure review) to understand the true state, prioritise fixes by risk and blast radius rather than ease of implementation, tackle systemic issues via policy where the same misconfiguration repeats across many resources, communicate a realistic roadmap with quick wins early to build stakeholder confidence, and build the governance guardrails (policy, PIM, centralised logging) that prevent debt from re-accumulating, not just fix the current backlog.","keyPoints":["Baseline assessment before prioritising anything","Risk/blast-radius-based prioritisation, not just 'easiest first'","Fix systemic issues via policy, not resource-by-resource","Sequence for early quick wins to build organisational trust","Build guardrails to prevent debt re-accumulating, not just a one-time cleanup"],"example":"Early quick wins like enabling MFA for all admin accounts and closing obviously public storage accounts can be delivered in weeks, building credibility for the longer-term programme of policy-driven, systemic remediation.","mistakes":"Presenting an overwhelming, undifferentiated list of every issue found without a clear, risk-based sequencing that stakeholders can actually act on.","followUp":"","seniorAdd":"A senior/lead candidate should also discuss how they'd resource and staff such a programme, and how they'd report progress to non-technical stakeholders.","num":74}];
const CATS = [["fundamentals","Azure Fundamentals"],["architecture","Azure Architecture & Networking"],["iam","Azure Identity & Access Management"],["security","Azure Security"],["defender","Microsoft Defender for Cloud"],["sentinel","Microsoft Sentinel / SIEM / SOC"],["governance","Azure Governance, Compliance & Policy"],["devsecops","Azure DevSecOps & CI/CD Security"],["storage","Azure Storage, Compute & Database Security"],["scenario","Scenario-Based / Troubleshooting"],["senior","Senior/Lead-Level Azure Security Questions"]];
const TOTAL = 74;
const BYDIFF = {"Beginner":14,"Intermediate":37,"Advanced":17,"Senior":6};
const SCENARIO_COUNT = 9;

const state = { scenarioOnly:false, seniorOnly:false, masteredOnly:false, open:new Set() };

function loadMastered(){
  try{ return new Set(JSON.parse(localStorage.getItem('az_guide_mastered')||'[]')); }
  catch(e){ return new Set(); }
}
function saveMastered(set){
  try{ localStorage.setItem('az_guide_mastered', JSON.stringify([...set])); }catch(e){}
}
let mastered = loadMastered();

function loadTheme(){
  try{ return localStorage.getItem('az_guide_theme') || 'light'; }catch(e){ return 'light'; }
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t==='dark' ? '☀️ Light mode' : '🌙 Dark mode';
  try{ localStorage.setItem('az_guide_theme', t); }catch(e){}
}
applyTheme(loadTheme());
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme')==='dark' ? 'light':'dark';
  applyTheme(cur);
});

function renderDashboard(){
  const el = document.getElementById('dashboard');
  const stats = [
    ['Total Questions', TOTAL],
    ['Beginner', BYDIFF.Beginner||0],
    ['Intermediate', BYDIFF.Intermediate||0],
    ['Advanced', BYDIFF.Advanced||0],
    ['Senior', BYDIFF.Senior||0],
    ['Scenario-Based', SCENARIO_COUNT],
    ['Mastered', mastered.size],
  ];
  el.innerHTML = stats.map(([l,n])=>'<div class="stat"><div class="n" id="stat-'+l.replace(/[^a-zA-Z]/g,'')+'">'+n+'</div><div class="l">'+l+'</div></div>').join('');
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function matchesFilters(q){
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const diff = document.getElementById('difficultyFilter').value;
  if(cat && q.category!==cat) return false;
  if(diff && q.difficulty!==diff) return false;
  if(state.scenarioOnly && !q.scenario) return false;
  if(state.seniorOnly && q.difficulty!=='Senior') return false;
  if(state.masteredOnly && !mastered.has(q.id)) return false;
  if(search){
    const hay = (q.question+' '+q.answer+' '+q.testing+' '+(q.keyPoints||[]).join(' ')+' '+q.categoryLabel).toLowerCase();
    if(!hay.includes(search)) return false;
  }
  return true;
}

function renderList(){
  const list = document.getElementById('questionList');
  const empty = document.getElementById('emptyState');
  const filtered = QUESTIONS.filter(matchesFilters);
  document.getElementById('resultCount').textContent = filtered.length + ' of ' + TOTAL + ' questions shown';
  if(filtered.length===0){ list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  list.innerHTML = filtered.map(cardHtml).join('');
  filtered.forEach(q=>{
    document.getElementById('head-'+q.id).addEventListener('click', ()=>toggleCard(q.id));
    const cb = document.getElementById('mastered-'+q.id);
    if(cb) cb.addEventListener('change', (e)=>{ e.stopPropagation(); toggleMastered(q.id); });
  });
  document.querySelectorAll('.qhead .mastered-check').forEach(el=>{
    el.addEventListener('click', (e)=> e.stopPropagation());
  });
}

function cardHtml(q){
  const isOpen = state.open.has(q.id);
  const isMastered = mastered.has(q.id);
  let body = '';
  if(isOpen){
    body = '<div class="qbody">' +
      '<div class="field"><h4>What the interviewer is testing</h4><p>'+escapeHtml(q.testing)+'</p></div>' +
      '<div class="field"><h4>Strong answer</h4><p>'+escapeHtml(q.answer)+'</p></div>' +
      '<div class="field"><h4>Key points to mention</h4><ul>'+(q.keyPoints||[]).map(k=>'<li>'+escapeHtml(k)+'</li>').join('')+'</ul></div>' +
      '<div class="field"><h4>Real-world Azure example</h4><p>'+escapeHtml(q.example)+'</p></div>' +
      '<div class="field mistakes"><h4>Common mistakes / weak answers</h4><p>'+escapeHtml(q.mistakes)+'</p></div>' +
      (q.followUp ? '<div class="field followup"><h4>Interviewer follow-up</h4><p>'+escapeHtml(q.followUp)+'</p></div>' : '') +
      (q.seniorAdd ? '<div class="field senioradd"><h4>What a senior candidate should add</h4><p>'+escapeHtml(q.seniorAdd)+'</p></div>' : '') +
      '</div>';
  }
  return '<div class="qcard'+(isOpen?' open':'')+'" id="card-'+q.id+'">' +
    '<div class="qhead" id="head-'+q.id+'">' +
      '<div>' +
        '<div class="qmeta">' +
          '<span class="qnum">Q'+q.num+'</span>' +
          '<span class="badge '+q.difficulty+'">'+q.difficulty+'</span>' +
          '<span class="badge cat">'+q.categoryLabel+'</span>' +
          (q.scenario?'<span class="badge scenario">Scenario</span>':'') +
          (isMastered?'<span class="badge mastered">✓ Mastered</span>':'') +
        '</div>' +
        '<p class="qtitle">'+escapeHtml(q.question)+'</p>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;">' +
        '<label class="mastered-check"><input type="checkbox" id="mastered-'+q.id+'" '+(isMastered?'checked':'')+'> Mastered</label>' +
        '<span class="chev">▾</span>' +
      '</div>' +
    '</div>' +
    body +
  '</div>';
}

function toggleCard(id){
  if(state.open.has(id)) state.open.delete(id); else state.open.add(id);
  renderList();
}
function toggleMastered(id){
  if(mastered.has(id)) mastered.delete(id); else mastered.add(id);
  saveMastered(mastered);
  renderDashboard();
  renderList();
}

document.getElementById('searchBox').addEventListener('input', renderList);
document.getElementById('categoryFilter').addEventListener('change', renderList);
document.getElementById('difficultyFilter').addEventListener('change', renderList);

document.getElementById('scenarioOnlyBtn').addEventListener('click', function(){
  state.scenarioOnly = !state.scenarioOnly;
  this.classList.toggle('active', state.scenarioOnly);
  renderList();
});
document.getElementById('seniorOnlyBtn').addEventListener('click', function(){
  state.seniorOnly = !state.seniorOnly;
  this.classList.toggle('active', state.seniorOnly);
  renderList();
});
document.getElementById('masteredOnlyBtn').addEventListener('click', function(){
  state.masteredOnly = !state.masteredOnly;
  this.classList.toggle('active', state.masteredOnly);
  renderList();
});
document.getElementById('expandAllBtn').addEventListener('click', ()=>{
  QUESTIONS.filter(matchesFilters).forEach(q=>state.open.add(q.id));
  renderList();
});
document.getElementById('collapseAllBtn').addEventListener('click', ()=>{
  state.open.clear();
  renderList();
});
document.getElementById('randomBtn').addEventListener('click', ()=>{
  const pool = QUESTIONS.filter(matchesFilters);
  if(pool.length===0) return;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('searchBox').value='';
  document.getElementById('categoryFilter').value='';
  document.getElementById('difficultyFilter').value='';
  state.scenarioOnly=false; state.seniorOnly=false; state.masteredOnly=false;
  document.querySelectorAll('.toolbar-buttons .toggle').forEach(b=>b.classList.remove('active'));
  state.open.clear();
  state.open.add(pick.id);
  renderList();
  const cardEl = document.getElementById('card-'+pick.id);
  if(cardEl) cardEl.scrollIntoView({behavior:'smooth', block:'center'});
});
document.getElementById('printBtn').addEventListener('click', ()=>{
  QUESTIONS.filter(matchesFilters).forEach(q=>state.open.add(q.id));
  renderList();
  setTimeout(()=>window.print(), 100);
});

/* Interview Practice Mode */
let practicePool = [];
let practiceCurrent = null;
let practiceStats = { seen:0, know:0, practice:0 };

function startPractice(){
  practicePool = QUESTIONS.slice();
  practiceStats = { seen:0, know:0, practice:0 };
  document.getElementById('practiceOverlay').classList.add('open');
  nextPracticeQuestion();
}
function nextPracticeQuestion(){
  if(practicePool.length===0) practicePool = QUESTIONS.slice();
  const idx = Math.floor(Math.random()*practicePool.length);
  practiceCurrent = practicePool.splice(idx,1)[0];
  document.getElementById('practiceAnswer').classList.remove('open');
  document.getElementById('practiceActions').style.display='none';
  document.getElementById('revealBtn').style.display='inline-block';
  document.getElementById('practiceMeta').innerHTML =
    '<span class="badge '+practiceCurrent.difficulty+'">'+practiceCurrent.difficulty+'</span>' +
    '<span class="badge cat">'+practiceCurrent.categoryLabel+'</span>' +
    (practiceCurrent.scenario?'<span class="badge scenario">Scenario</span>':'');
  document.getElementById('practiceQuestion').textContent = 'Q'+practiceCurrent.num+'. '+practiceCurrent.question;
  document.getElementById('practiceProgress').textContent =
    'Session: '+practiceStats.seen+' seen · '+practiceStats.know+' known · '+practiceStats.practice+' need practice';
}
document.getElementById('practiceBtn').addEventListener('click', startPractice);
document.getElementById('practiceClose').addEventListener('click', ()=>{
  document.getElementById('practiceOverlay').classList.remove('open');
});
document.getElementById('revealBtn').addEventListener('click', ()=>{
  const q = practiceCurrent;
  document.getElementById('practiceAnswer').innerHTML =
    '<div class="field"><h4>Strong answer</h4><p>'+escapeHtml(q.answer)+'</p></div>' +
    '<div class="field"><h4>Key points to mention</h4><ul>'+(q.keyPoints||[]).map(k=>'<li>'+escapeHtml(k)+'</li>').join('')+'</ul></div>' +
    '<div class="field"><h4>Real-world Azure example</h4><p>'+escapeHtml(q.example)+'</p></div>';
  document.getElementById('practiceAnswer').classList.add('open');
  document.getElementById('practiceActions').style.display='flex';
  document.getElementById('revealBtn').style.display='none';
});
document.getElementById('knowThisBtn').addEventListener('click', ()=>{
  practiceStats.seen++; practiceStats.know++;
  mastered.add(practiceCurrent.id); saveMastered(mastered); renderDashboard();
  nextPracticeQuestion();
});
document.getElementById('needPracticeBtn').addEventListener('click', ()=>{
  practiceStats.seen++; practiceStats.practice++;
  nextPracticeQuestion();
});
document.getElementById('nextRandomBtn').addEventListener('click', ()=>{
  nextPracticeQuestion();
});

renderDashboard();
renderList();
</script>
</body>
</html>
